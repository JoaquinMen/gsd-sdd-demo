[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cimbal-secure-agent"
version = "1.0.0"
description = "Cimbal SA Secure Operations & Agriculture Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.3",
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-discoveryengine>=0.11.0",
    "google-cloud-storage>=2.14.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "fpdf2>=2.7.8",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
